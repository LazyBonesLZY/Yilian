name: Android

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    if: github.event_name != 'push' || !startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      # 不用 android-actions/setup-android：Node 24 runner 上那个 action 已经起不来。
      # 镜像自带 cmdline-tools，但 PATH 不一定含 sdkmanager，所以按 ANDROID_HOME 找。
      - name: Install SDK 37
        uses: ./.github/actions/android-sdk

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: yilian-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Install SDK 37
        uses: ./.github/actions/android-sdk

      # 四个 secret 缺一个就编出未签名包。未签名包不能覆盖安装，也不要当成正式版。
      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.YILIAN_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.YILIAN_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.YILIAN_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.YILIAN_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$STORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/yilian-release.jks"
            echo "YILIAN_STORE_FILE=$RUNNER_TEMP/yilian-release.jks" >> "$GITHUB_ENV"
            echo "YILIAN_STORE_PASSWORD=$STORE_PASSWORD" >> "$GITHUB_ENV"
            echo "YILIAN_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
            echo "YILIAN_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
          else
            echo "::warning::未配置发布签名 secret，release APK 将是未签名的，不会上传到 Release。"
          fi

      - name: Release APK
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Publish signed APK
        if: env.YILIAN_STORE_FILE != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" \
            app/build/outputs/apk/release/app-release.apk \
            --title "翼连 Yilian $version" \
            --notes "由标签 $GITHUB_REF_NAME 自动构建。" \
            --verify-tag
